<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect trick
      // Converts a URL like /repo-name/wrapped to /repo-name/#/wrapped
      var pathSegmentsToKeep = 1; // 1 for GitHub Pages e.g., /repo-name/
      
      var l = window.location;
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
        
      // For this app, simply converting to a hash route works perfectly 
      // since App.jsx supports #/wrapped
      var appPath = l.pathname.split('/').pop();
      if (appPath === 'wrapped') {
        window.location.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.replace('/wrapped', '/#/wrapped') + l.search
        );
      } else {
        // Fallback: just go to the home page of the repo
        window.location.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/'
        );
      }
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
